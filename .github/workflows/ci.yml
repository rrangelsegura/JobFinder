name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-node:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  backend-python:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: backend
    env:
      # actions/setup-python fails on this runner, and the ambient `python`
      # on PATH resolves to an unrelated tool's venv without pip. Use the
      # real Python 3.11 install directly and always work in a fresh,
      # isolated venv — never the global site-packages.
      PYTHON_EXE: C:\Users\Usuario\AppData\Local\Microsoft\WindowsApps\PythonSoftwareFoundation.Python.3.11_qbz5n2kfra8p0\python.exe
    steps:
      - uses: actions/checkout@v4
      - run: & "$env:PYTHON_EXE" -m venv .venv-ci
      - run: .\.venv-ci\Scripts\python.exe -m pip install -r requirements.txt
      - run: .\.venv-ci\Scripts\python.exe -m pytest

  frontend:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
