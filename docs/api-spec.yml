openapi: 3.0.0
info:
  title: JobFinder API
  description: |
    REST API for the JobFinder platform, providing core functionality for
    candidate management, job offers, matching, action plans, and
    AI‑driven coaching. The API follows Domain‑Driven Design principles
    and is built on a hybrid Node.js API gateway with a Python agentic core.
  version: 0.1.0
  contact:
    name: JobFinder Development Team
    url: https://github.com/rrangelsegura/JobFinder
  license:
    name: MIT
    url: https://github.com/rrangelsegura/JobFinder/blob/main/LICENSE
servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.jobfinder.dev
    description: Production server
tags:
  - name: Candidates
    description: Operations related to candidate profiles
  - name: JobOffers
    description: Operations related to job listings
  - name: Matches
    description: Operations that compute and retrieve match scores
  - name: ActionPlans
    description: Operations for action plans and coaching
  - name: Uploads
    description: Operations for uploading CVs and other documents
  - name: Auth
    description: Candidate registration, login, logout, and session check
paths:
  /auth/register:
    post:
      summary: Register a new candidate
      description: |
        Creates a Candidate with a bcrypt-hashed password (cost 12).
        firstName/lastName are not collected here — they're written as
        placeholder values and stay independent of any CV the candidate
        later uploads (see cv-extraction's "Persistence and Embedding of
        Extraction Results"). Sends a single, one-shot reminder email
        prompting a CV upload.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Candidate created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid email, password under 8 characters, or email already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /auth/login:
    post:
      summary: Log in
      description: |
        On success, creates a Redis-backed session and sets an httpOnly,
        sameSite=lax session cookie (secure in production). Unknown email
        and wrong password return the identical generic error
        (anti-enumeration). Rate-limited per-IP and per-email.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login succeeded; session cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Invalid email or password (same message for both causes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "429":
          description: Too many login attempts from this IP or for this email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /auth/session:
    get:
      summary: Check the current session
      description: What ProtectedRoute (frontend) and requireAuth-derived flows gate on.
      tags:
        - Auth
      responses:
        "200":
          description: A valid session exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /auth/logout:
    post:
      summary: Log out
      description: Deletes the Redis session record and clears the cookie immediately.
      tags:
        - Auth
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
  /candidates:
    get:
      summary: List candidates
      description: Retrieve a paginated list of candidate profiles.
      tags:
        - Candidates
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of records per page
        - in: query
          name: search
          schema:
            type: string
          description: Term to search in name or email
        - in: query
          name: sort
          schema:
            type: string
            enum: [firstName,lastName,email]
            default: firstName
          description: Field to sort by
        - in: query
          name: order
          schema:
            type: string
            enum: [asc,desc]
            default: asc
          description: Sort direction
      responses:
        "200":
          description: A page of candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create a candidate
      description: Create a new candidate profile, including personal data, education, and experience.
      tags:
        - Candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCandidateRequest"
      responses:
        "201":
          description: Candidate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /candidates/{id}:
    get:
      summary: Get a candidate
      description: Retrieve detailed information about a candidate by ID.
      tags:
        - Candidates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Candidate ID
      responses:
        "200":
          description: Candidate details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update a candidate
      description: Update existing candidate data.
      tags:
        - Candidates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Candidate ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCandidateRequest"
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete a candidate
      description: Remove a candidate profile.
      tags:
        - Candidates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Candidate ID
      responses:
        "204":
          description: Candidate deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /candidates/{id}/matches:
    get:
      summary: Get match scores for a candidate
      description: Retrieve the match scores between the candidate and all available job offers.
      tags:
        - Matches
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Candidate ID
      responses:
        "200":
          description: List of match results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /job-offers:
    get:
      summary: List job offers
      tags:
        - JobOffers
      responses:
        "200":
          description: List of job offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOfferList"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create a job offer
      tags:
        - JobOffers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobOfferRequest"
      responses:
        "201":
          description: Job offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOffer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /job-offers/{id}:
    get:
      summary: Get a job offer
      tags:
        - JobOffers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOffer"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update a job offer
      tags:
        - JobOffers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobOfferRequest"
      responses:
        "200":
          description: Updated offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOffer"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /job-offers/{id}/matches:
    get:
      summary: Get match score for a job offer and a candidate
      tags:
        - Matches
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            description: Job offer ID
        - in: query
          name: candidate_id
          required: true
          schema:
            type: integer
          description: Candidate ID
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /action-plans:
    get:
      summary: List action plans
      tags:
        - ActionPlans
      responses:
        "200":
          description: List of action plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPlanList"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /uploads/cv:
    post:
      summary: Upload a CV for asynchronous extraction
      description: |
        Accepts a PDF CV and enqueues an async extraction job (OCR + LLM
        structured extraction + embedding) instead of processing inline.
        Poll `GET /uploads/cv/{jobId}` for the result. Implements
        `parse-candidate-cv`'s `cv-upload` capability. Requires an
        authenticated session — `candidateId` is derived server-side from
        it (`requireAuth`) and is never accepted from the request body
        (candidate-authentication's `cv-upload` delta spec).
      tags:
        - Uploads
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF only, max 10MB.
      responses:
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "202":
          description: Upload accepted; extraction is processing asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVUploadAcceptedResponse"
        "400":
          description: |
            Missing file, non-PDF file, file over 10MB, or a file that
            cannot be parsed as a valid PDF (corrupted/unreadable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadErrorResponse"
  /uploads/cv/{jobId}:
    get:
      summary: Get CV extraction job status
      description: |
        Poll for the status of an extraction job enqueued by
        `POST /uploads/cv`. Implements `parse-candidate-cv`'s
        `cv-extraction-status` capability.
      tags:
        - Uploads
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: |
            Job found. `data.status` is `processing`, `completed` (with
            `data.candidate` populated), or `failed` (with `data.error`
            populated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVExtractionStatusResponse"
        "404":
          description: No extraction job exists with the given id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadErrorResponse"
  # Additional paths for OCR, coaching, etc., can be added later
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: jobfinder_session
  schemas:
    RegisterResponse:
      type: object
      description: Standard response envelope per docs/backend-standards.md.
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          properties:
            candidateId:
              type: integer
        agent_trace_id:
          type: string
          format: uuid
        model_used:
          type: string
          nullable: true
    SessionResponse:
      type: object
      description: Standard response envelope per docs/backend-standards.md.
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          properties:
            candidateId:
              type: integer
            email:
              type: string
              format: email
        agent_trace_id:
          type: string
          format: uuid
        model_used:
          type: string
          nullable: true
    AuthErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        data:
          type: object
          properties:
            error:
              type: string
        agent_trace_id:
          type: string
          format: uuid
        model_used:
          type: string
          nullable: true
    EmptySuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
        agent_trace_id:
          type: string
          format: uuid
        model_used:
          type: string
          nullable: true
    CandidateList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    Candidate:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        aboutMe:
          type: string
        education:
          type: array
          items:
            type: object
            properties:
              institution:
                type: string
              degree:
                type: string
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
                nullable: true
        experience:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              role:
                type: string
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
                nullable: true
    CreateCandidateRequest:
      type: object
      required: [firstName,lastName,email]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        aboutMe:
          type: string
        education:
          type: array
          items: {}
        experience:
          type: array
          items: {}
    UpdateCandidateRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        aboutMe:
          type: string
        education:
          type: array
          items: {}
        experience:
          type: array
          items: {}
    MatchResultList:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MatchResult"
    MatchResult:
      type: object
      properties:
        jobOfferId:
          type: integer
        candidateId:
          type: integer
        score:
          type: number
          description: 0-10 scale
      required: [jobOfferId,score]
    JobOfferList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JobOffer"
    JobOffer:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        company:
          type: string
        location:
          type: string
        salaryRange:
          type: string
        requiredSkills:
          type: array
          items:
            type: string
    CreateJobOfferRequest:
      type: object
      required: [title,company]
      properties: {}
    UpdateJobOfferRequest:
      type: object
      properties: {}
    ActionPlanList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActionPlan"
    ActionPlan:
      type: object
      properties:
        id:
          type: integer
        candidateId:
          type: integer
        steps:
          type: array
          items:
            type: string
    CVUploadAcceptedResponse:
      type: object
      description: Standard response envelope per docs/backend-standards.md.
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          properties:
            resumeId:
              type: integer
            jobId:
              type: string
            status:
              type: string
              enum: [processing]
        agent_trace_id:
          type: string
          format: uuid
        model_used:
          type: string
          nullable: true
    CVExtractionStatusResponse:
      type: object
      description: Standard response envelope per docs/backend-standards.md.
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          properties:
            status:
              type: string
              enum: [processing, completed, failed]
            candidate:
              description: Present only when status is "completed".
              $ref: "#/components/schemas/ExtractedCandidate"
            error:
              type: string
              description: Present only when status is "failed".
        agent_trace_id:
          type: string
          format: uuid
        model_used:
          type: string
          nullable: true
    UploadErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        data:
          type: object
          properties:
            error:
              type: string
        agent_trace_id:
          type: string
          format: uuid
        model_used:
          type: string
          nullable: true
    ExtractedCandidate:
      type: object
      description: |
        The CV Analyst agent's structured extraction output (snake_case, as
        returned by the Python agent and passed through unmodified — distinct
        from the camelCase `Candidate` schema used elsewhere in this API).
      properties:
        personal_info:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
        education:
          type: array
          items:
            type: object
            properties:
              institution:
                type: string
              title:
                type: string
              start_date:
                type: string
                format: date
              end_date:
                type: string
                format: date
                nullable: true
        work_experience:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              position:
                type: string
              description:
                type: string
                nullable: true
              start_date:
                type: string
                format: date
              end_date:
                type: string
                format: date
                nullable: true
        skills:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum: [technical, soft]
        languages:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              proficiency:
                type: string
                nullable: true
        certifications:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              issuer:
                type: string
                nullable: true
              issue_date:
                type: string
                format: date
                nullable: true
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        details:
          type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
